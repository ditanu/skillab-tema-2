[project]
name = "skillab-tema-2-extraction-pipeline"
version = "0.1.0"
description = "Extraction Pipeline L3 + L4: extraction, storage, and RAG search"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "sentence-transformers>=2.7.0",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "docx2txt>=0.8",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.5",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
]

[tool.ruff]
line-length = 100
